<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stats · autm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js" defer></script>
    <script src="lastfm.js" defer></script>
    <script src="toplists.js" defer></script>
    <script src="stats.js" defer></script>
</head>
<body>
  <div class="app">

  <aside class="sidebar">
    <a href="#" class="logo">
      <img src="images/logo.svg" alt="" width="26">
      <span>autm</span>
    </a>

    <nav class="nav">
      <a href="index.html" class="nav-link"><span class="nav-icon"></span>Feed</a>
      <a href="stats.html" class="nav-link active"><span class="nav-icon"></span>My Stats</a>
      <a href="#" class="nav-link"><span class="nav-icon"></span>Ranks</a>
      <a href="#" class="nav-link"><span class="nav-icon"></span>Friends</a>
      <a href="#" class="nav-link"><span class="nav-icon"></span>Settings</a>
      <a href="#" class="nav-link"><span class="nav-icon"></span>About</a>
    </nav>

     <a href="index.html" class="button-primary">+ Add friend</a>
    <a class="me" href="profile.html"></a>
      <span class="avatar large" id="my-avatar">J</span>
      <div>
        <p class="me-name">Jauvis</p>
        <p class="me-handle">@jauvis</p>
      </div>
    </a>
  </aside>
    <main class="main">
     <header class="page-header">
  <div>
    <h1>My Stats</h1>
    <p class="subtitle">@Jauvisss on Last.fm</p>
  </div>
  <div class="tabs">
    <button class="tab active" data-period="7day">7 days</button>
    <button class="tab" data-period="1month">1 month</button>
    <button class="tab" data-period="12month">1 year</button>
  </div>
</header>
<div class="overview">
  <section class="overview-main">
    <div class="overview-top">
      <div>
        <p class="overview-label">Plays this week</p>
        <p class="overview-number" id="total-plays">–</p>
      </div>
      <span class="change-pill" id="change-pill"></span>
    </div>
    <div class="chart" id="daily-chart" aria-label="Plays per day, last 7 days"></div>
  </section>

  <div class="side-tiles">
    <div class="tile">
      <p class="tile-label">Daily average</p>
      <p class="tile-value" id="daily-average">–</p>
      <p class="tile-note">plays per day</p>
    </div>
    <div class="tile">
      <p class="tile-label">Top artist</p>
      <p class="tile-value" id="tile-top-artist">–</p>
      <p class="tile-note" id="tile-top-artist-plays"></p>
    </div>
  </div>
</div>

<div class="top-lists">
  <section class="top-list">
    <div class="section-header">
      <h2>Top artists</h2>
    </div>
    <ol class="top-rows" id="top-artists"></ol>
  </section>

  <section class="top-list">
    <div class="section-header">
      <h2>Top tracks</h2>
    </div>
    <ol class="top-rows" id="top-tracks"></ol>
  </section>

  <section class="top-list">
    <div class="section-header">
      <h2>Top albums</h2>
    </div>
    <ol class="top-rows" id="top-albums"></ol>
  </section>
</div>
 </main>
</div>

</body>
</html>
